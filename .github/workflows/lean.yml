name: Lean kernel check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore Lake workspace cache
        uses: actions/cache@v4
        with:
          path: |
            .lake/packages
            .lake/build
            lake-manifest.json
          key: lean-lake-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Install elan
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install pinned Lean and resolve dependencies
        run: |
          elan toolchain install leanprover/lean4:v4.27.0
          lake --version
          lake update
      - name: Restore mathlib binary cache
        run: lake exe cache get
      - name: Kernel-check all proofs
        run: lake build --wfail
      - name: Reject locally declared axioms
        run: |
          if grep -R --line-number -E '^[[:space:]]*axiom[[:space:]]' --include='*.lean' . --exclude-dir=.lake; then
            echo 'Locally declared axiom detected.' >&2
            exit 1
          fi
