name: Lean kernel check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build with Lean 4.27 and mathlib
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true
      - name: Reject unfinished proofs
        run: |
          if grep -R --line-number -E '\bsorry\b|admit|axiom' --include='*.lean' .; then
            echo 'Unfinished proof or added axiom detected.' >&2
            exit 1
          fi
